AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: docrepo-parseS3-event

## Bucket names - override in sam deploy for custom names
Parameters:
  Dept1BucketName:
    Type: String
    Default: 'patterns-s3-eventbridge-docs1'
  Dept2BucketName:
    Type: String
    Default: 'patterns-s3-eventbridge-docs2'
  Dept3BucketName:
    Type: String
    Default: 'patterns-s3-eventbridge-docs3'

Resources:
  # EventBridge rule and permission to invoke Lambda function
  # Matches the native S3 "Object Created" events sent by the
  # department buckets (EventBridge notifications are enabled in setup)
  EventRule: 
    Type: AWS::Events::Rule
    Properties: 
      Description: "docrepo-parseS3-event"
      State: "ENABLED"
      EventPattern: 
        source: 
          - "aws.s3"
        detail-type:
          - "Object Created"
        detail: 
          bucket:
            name:
              - !Sub '${Dept1BucketName}-${AWS::AccountId}-${AWS::Region}'
              - !Sub '${Dept2BucketName}-${AWS::AccountId}-${AWS::Region}'
              - !Sub '${Dept3BucketName}-${AWS::AccountId}-${AWS::Region}'  
      Targets: 
        - Arn: 
            Fn::GetAtt: 
              - "ParseS3eventFunction"
              - "Arn"
          Id: "PDF"            

  PermissionForEventsToInvokeLambda: 
    Type: AWS::Lambda::Permission
    Properties: 
      FunctionName: 
        Ref: "ParseS3eventFunction"
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: 
        Fn::GetAtt: 
          - "EventRule"
          - "Arn"

  # Lambda functions
  ParseS3eventFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: parserFunction/
      Handler: app.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      Timeout: 5
      MemorySize: 128
      Policies:
        - Statement:
          - Effect: Allow
            Resource: '*'
            Action:
              - events:PutEvents           
