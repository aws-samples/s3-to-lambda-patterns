AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: docrepo-setup

## Bucket names - override in sam deploy for custom names
Parameters:
  Dept1BucketName:
    Type: String
    Default: 'patterns-s3-eventbridge-docs1'
  Dept2BucketName:
    Type: String
    Default: 'patterns-s3-eventbridge-docs2'
  Dept3BucketName:
    Type: String
    Default: 'patterns-s3-eventbridge-docs3'

## S3 buckets - EventBridge notifications are enabled so that S3 sends
## object-level events (such as Object Created) to the default event bus
Resources:
  Dept1Bucket:
    Type: AWS::S3::Bucket  
    Properties:
      BucketName: !Sub '${Dept1BucketName}-${AWS::AccountId}-${AWS::Region}'
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
  Dept2Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Dept2BucketName}-${AWS::AccountId}-${AWS::Region}'
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
  Dept3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Dept3BucketName}-${AWS::AccountId}-${AWS::Region}'
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

# Used by any target functions to access the S3
# buckets. If more buckets need to be added, add here
# instead of at each function. The policy ARN is exported
# so other stacks can import it with Fn::ImportValue.

  MyManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument: 
        Version: 2012-10-17
        Statement: 
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              - !Sub 'arn:aws:s3:::${Dept1Bucket}/*'
              - !Sub 'arn:aws:s3:::${Dept2Bucket}/*'
              - !Sub 'arn:aws:s3:::${Dept3Bucket}/*'
          # Bucket-level actions must target the bucket ARN, not objects
          - Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
              - s3:GetLifecycleConfiguration
            Resource:
              - !Sub 'arn:aws:s3:::${Dept1Bucket}'
              - !Sub 'arn:aws:s3:::${Dept2Bucket}'
              - !Sub 'arn:aws:s3:::${Dept3Bucket}'

## Outputs
Outputs: 
  Dept1BucketName:
    Description: Department 1 documents bucket
    Value: !Ref Dept1Bucket
  Dept2BucketName:
    Description: Department 2 documents bucket
    Value: !Ref Dept2Bucket
  Dept3BucketName:
    Description: Department 3 documents bucket
    Value: !Ref Dept3Bucket
  S3ReadPolicyArn:
    Description: Managed policy granting read access to the department buckets
    Value: !Ref MyManagedPolicy
    Export:
      Name: !Sub '${AWS::StackName}-S3ReadPolicyArn'
