AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: S3-to-Lambda video - Example 1 v2

Parameters:
  TargetLanguage:
    Type: String
    Default: 'fr es it'
    Description: (Required) A list of target language codes (separated by spaces)
  TranslationBucketName:
    Type: String
    Default: 'svs214-ex1-translation'
  BatchingBucketName:
    Type: String
    Default: 'svs214-ex1-batching'

Globals:
  Function:
    Timeout: 15

Resources:
  ## S3 buckets
  BatchingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BatchingBucketName}-${AWS::AccountId}-${AWS::Region}'
  TranslationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${TranslationBucketName}-${AWS::AccountId}-${AWS::Region}'

  ## Lambda functions
  TranslatorFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: translatorFunction/
      Handler: app.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Environment:
        Variables:
          targetLanguage: !Ref TargetLanguage
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub '${TranslationBucketName}-${AWS::AccountId}-${AWS::Region}'
        - Statement:
          - Effect: Allow
            Resource: '*'
            Action:
              - translate:*
              - comprehend:DetectDominantLanguage
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
      Events:
        FileUpload:
          Type: S3
          Properties:
            Bucket: !Ref TranslationBucket
            Events: s3:ObjectCreated:*
            Filter: 
              S3Key:
                Rules:
                  - Name: suffix
                    Value: '.txt'            

  BatchingFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: batchingFunction/
      Handler: app.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 512
      Environment:
        Variables:
          OutputBucket: !Sub '${TranslationBucketName}-${AWS::AccountId}-${AWS::Region}'
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub '${TranslationBucketName}-${AWS::AccountId}-${AWS::Region}'
        - S3ReadPolicy:
            BucketName: !Sub '${BatchingBucketName}-${AWS::AccountId}-${AWS::Region}'
      Events:
        OriginalTextUpload:
          Type: S3
          Properties:
            Bucket: !Ref BatchingBucket
            Events: s3:ObjectCreated:*
            Filter: 
              S3Key:
                Rules:
                  - Name: suffix
                    Value: '.txt'     