AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: S3-to-Lambda video - Example 4.

Parameters:
  InputBucketName:
    Type: String
    Default: 'svs214-ex4-workflow'

Globals:
  Function:
    Timeout: 10

Resources:
  ## S3 buckets
  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${InputBucketName}-${AWS::AccountId}-${AWS::Region}'

  ## Lambda functions
  ProcessFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: processFunction/
      Handler: app.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Environment:
        Variables:
          stateMachineArn: !Ref 'DogOrCatStateMachine'
      Policies:
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt DogOrCatStateMachine.Name
      Events:
        FileUpload:
          Type: S3
          Properties:
            Bucket: !Ref InputBucket
            Events: s3:ObjectCreated:*
            Filter: 
              S3Key:
                Rules:
                  - Name: suffix
                    Value: '.jpg'            

  DogFoundFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: foundFunction/
      Handler: dog.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128

  CatFoundFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: foundFunction/
      Handler: cat.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128      

  ## Step Functions state machine
  # Calls Rekognition directly using the AWS SDK service integration - see statemachine/dogorcat.asl.json
  DogOrCatStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/dogorcat.asl.json
      DefinitionSubstitutions:
        DogFoundFunctionArn: !GetAtt DogFoundFunction.Arn
        CatFoundFunctionArn: !GetAtt CatFoundFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref DogFoundFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CatFoundFunction
        # Rekognition reads the image from S3 using the state machine's credentials
        - RekognitionDetectOnlyPolicy: {}
        - S3ReadPolicy:
            BucketName: !Sub '${InputBucketName}-${AWS::AccountId}-${AWS::Region}'
