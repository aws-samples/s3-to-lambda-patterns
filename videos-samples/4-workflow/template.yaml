AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: S3-to-Lambda video - Example 4.

Parameters:
  InputBucketName:
    Type: String
    Default: 'svs214-ex4-workflow'

Globals:
  Function:
    Timeout: 10

Resources:
  ## S3 buckets
  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${InputBucketName}-${AWS::AccountId}-${AWS::Region}'

  ## Lambda functions
  ProcessFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: processFunction/
      Handler: app.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Environment:
        Variables:
          stateMachineArn: !Ref 'DogOrCatStateMachine'
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub '${InputBucketName}-${AWS::AccountId}-${AWS::Region}'
        - Statement:
          - Effect: Allow
            Resource: !Ref DogOrCatStateMachine
            Action:
              - states:StartExecution
      Events:
        FileUpload:
          Type: S3
          Properties:
            Bucket: !Ref InputBucket
            Events: s3:ObjectCreated:*
            Filter: 
              S3Key:
                Rules:
                  - Name: suffix
                    Value: '.jpg'            

  DogFoundFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: foundFunction/
      Handler: dog.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128

  CatFoundFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: foundFunction/
      Handler: cat.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128      

  ## Step Functions state machine
  DogOrCatStateMachine:
    Type: 'AWS::StepFunctions::StateMachine'
    Properties:
      DefinitionString: !Sub |
        {
          "Comment": "Is it a dog or a cat?",
          "QueryLanguage": "JSONata",
          "StartAt": "IsDogOrCat",
          "States": {
            "IsDogOrCat": {
              "Comment": "Calls Rekognition directly using the AWS SDK service integration",
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:rekognition:detectLabels",
              "Arguments": {
                "Image": {
                  "S3Object": {
                    "Bucket": "{% $states.input.bucket %}",
                    "Name": "{% $states.input.key %}"
                  }
                },
                "MaxLabels": 10,
                "MinConfidence": 70
              },
              "Output": {
                "bucket": "{% $states.input.bucket %}",
                "key": "{% $states.input.key %}",
                "animal": "{% $count($states.result.Labels[Name = 'Dog']) > 0 ? 'Dog' : $count($states.result.Labels[Name = 'Cat']) > 0 ? 'Cat' : 'Unknown' %}"
              },
              "Next": "ChoiceState"
            },
            "ChoiceState": {
              "Type" : "Choice",
              "Choices": [
                {
                  "Condition": "{% $states.input.animal = 'Dog' %}",
                  "Next": "DogFound"
                },
                {
                  "Condition": "{% $states.input.animal = 'Cat' %}",
                  "Next": "CatFound"
                }
              ],
              "Default": "UnknownAnimal"
            },

            "DogFound": {
              "Type" : "Task",
              "Resource": "${DogFoundFunction.Arn}",
              "Next": "NextState"
            },

            "CatFound": {
              "Type" : "Task",
              "Resource": "${CatFoundFunction.Arn}",
              "Next": "NextState"
            },

            "UnknownAnimal": {
              "Type": "Fail",
              "Error": "DefaultStateError",
              "Cause": "No Matches!"
            },

            "NextState": {
              "Type": "Pass",
              "End": true
            }
          }
        }
      RoleArn: !GetAtt 'StateMachineRole.Arn'

  # IAM roles
  StateMachineRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: !Sub 'states.${AWS::Region}.amazonaws.com'
          Action: 'sts:AssumeRole'
      Policies:
      - PolicyName: lambda
        PolicyDocument:
          Statement:
          - Effect: Allow
            Action: 'lambda:InvokeFunction'
            Resource:
            - !GetAtt DogFoundFunction.Arn
            - !GetAtt CatFoundFunction.Arn
      # Rekognition reads the image from S3 using the state machine's credentials
      - PolicyName: rekognition
        PolicyDocument:
          Statement:
          - Effect: Allow
            Action: 'rekognition:DetectLabels'
            Resource: '*'
          - Effect: Allow
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${InputBucketName}-${AWS::AccountId}-${AWS::Region}/*'
