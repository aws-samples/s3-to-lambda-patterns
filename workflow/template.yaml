AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: patterns-s3-workflow.

Parameters:
  InputBucketName:
    Type: String
    Default: 'patterns-s3workflow'
  RequiredLabels:
    Type: String
    Description: Comma-separated Rekognition labels that must all be found for a match (leave empty to skip)
    Default: 'Cat,Mammal'
  RequiredWords:
    Type: String
    Description: Comma-separated words that must all be found in the image text for a match (leave empty to skip)
    Default: ''
  MinConfidence:
    Type: Number
    Description: Minimum Rekognition confidence for labels and words
    Default: 70

Globals:
  Function:
    Timeout: 15
    MemorySize: 128
    Runtime: nodejs24.x    
    Architectures:
      - arm64

Resources:
  ## S3 buckets
  InputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${InputBucketName}-${AWS::AccountId}-${AWS::Region}'

  ## Lambda functions
  StartExecutionFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: StartExecutionFunction/
      Handler: app.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      Environment:
        Variables:
          stateMachineArn: !Ref 'MatcherStateMachine'
      Policies:
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt MatcherStateMachine.Name
      Events:
        FileUpload:
          Type: S3
          Properties:
            Bucket: !Ref InputBucket
            Events: s3:ObjectCreated:*

  MatchFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: resultFunction/
      Handler: match.handler

  NoMatchFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: resultFunction/
      Handler: noMatch.handler


  ## Step Functions state machine
  # Calls Rekognition directly using the AWS SDK service integration - see statemachine/matcher.asl.json
  MatcherStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/matcher.asl.json
      DefinitionSubstitutions:
        MatchFunctionArn: !GetAtt MatchFunction.Arn
        NoMatchFunctionArn: !GetAtt NoMatchFunction.Arn
        RequiredLabels: !Ref RequiredLabels
        RequiredWords: !Ref RequiredWords
        MinConfidence: !Ref MinConfidence
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref MatchFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref NoMatchFunction
        # Rekognition reads the image from S3 using the state machine's credentials
        - RekognitionDetectOnlyPolicy: {}
        - S3ReadPolicy:
            BucketName: !Sub '${InputBucketName}-${AWS::AccountId}-${AWS::Region}'
